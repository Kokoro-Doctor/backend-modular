# ---------------------------------------------------------------------------
# SANITIZED EXAMPLE TEMPLATE — safe to commit.
#
# Generated from the real template.yaml, which is gitignored because it had
# live credentials inline. Every secret here is a CloudFormation Parameter.
# Supply real values at deploy time via samconfig.toml parameter_overrides or
# `sam deploy --parameter-overrides`; never commit real values back into this file.
#
# See docs/DEPLOYMENT.md and docs/ENVIRONMENT_VARIABLES.md.
# ---------------------------------------------------------------------------
AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: SAM Template for API Gateway and Lambda Functions.

Parameters:
  BrevoSmtpUser:
    Type: String
    Description: 'Brevo SMTP login (transactional email).'
    Default: "your-user@smtp-brevo.com"

  BrevoSmtpKey:
    Type: String
    Description: 'Brevo SMTP API key. SECRET.'
    NoEcho: true
    Default: ""

  JwtSecret:
    Type: String
    Description: 'HMAC signing key for Kokoro JWTs. Must be IDENTICAL across AuthLambda, ABHALambda and HospitalsLambda or tokens fail to validate. SECRET.'
    NoEcho: true
    Default: ""

  AuthAdminKey:
    Type: String
    Description: 'x-admin-key for POST /auth/admin/delete-account. SECRET.'
    NoEcho: true
    Default: ""

  BookingAdminKey:
    Type: String
    Description: 'x-admin-key for POST /booking/admin/test-subscription. SECRET.'
    NoEcho: true
    Default: ""

  OpenAiApiKey:
    Type: String
    Description: 'OpenAI API key (chat_lambda). SECRET.'
    NoEcho: true
    Default: ""

  GroqApiKeyChat:
    Type: String
    Description: 'Groq API key used by chat_lambda. SECRET.'
    NoEcho: true
    Default: ""

  GroqApiKeyMedilocker:
    Type: String
    Description: 'Groq API key used by medilocker_lambda. SECRET.'
    NoEcho: true
    Default: ""

  RazorpayKeyId:
    Type: String
    Description: 'Razorpay key id. Use a rzp_test_ key for non-prod.'
    Default: "rzp_test_xxxxxxxxxxxx"

  RazorpayKeySecret:
    Type: String
    Description: 'Razorpay key secret. SECRET.'
    NoEcho: true
    Default: ""

  RazorpayWebhookSecret:
    Type: String
    Description: 'Shared secret used to verify Razorpay webhook signatures. SECRET.'
    NoEcho: true
    Default: ""

  HospitalApiKey:
    Type: String
    Description: 'x-hospital-api-key for /hospital/* raw ingestion routes. SECRET.'
    NoEcho: true
    Default: ""

  AbdmClientId:
    Type: String
    Description: 'ABDM client id issued in the ABDM sandbox/prod portal.'
    Default: "SBXID_XXXXXX"

  AbdmClientSecret:
    Type: String
    Description: 'ABDM client secret. SECRET.'
    NoEcho: true
    Default: ""

  AbdmGatewayBaseUrl:
    Type: String
    Description: 'ABDM gateway base URL. Sandbox: https://dev.abdm.gov.in'
    Default: "https://dev.abdm.gov.in"

  AbdmAbhaBaseUrl:
    Type: String
    Description: 'ABHA service base URL. Sandbox: https://abhasbx.abdm.gov.in'
    Default: "https://abhasbx.abdm.gov.in"

  AbdmXCmId:
    Type: String
    Description: 'ABDM consent-manager id. Sandbox: sbx, production: abdm'
    Default: "sbx"

  KokoroWebhookBaseUrl:
    Type: String
    Description: 'Public API Gateway base URL ABDM calls back on. Must be reachable from the ABDM gateway.'
    Default: "https://REPLACE.execute-api.ap-south-1.amazonaws.com/prod"

  RagServerUrl:
    Type: String
    Description: 'RAG server endpoint used by chat_lambda.'
    Default: "http://REPLACE:8000/rag"

  OllamaApi:
    Type: String
    Description: 'Ollama endpoint (chat_lambda).'
    Default: "https://kokoro.doctor/ollama"

  AdminEmail:
    Type: String
    Description: 'Recipient for payment/ops notification email.'
    Default: "business.support@kokoro.doctor"

Resources:
  #============================== DynamoDB Tables ======================================
  ## Users Table
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phoneNumber
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phoneNumber
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ## Doctors Table
  DoctorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Doctors
      AttributeDefinitions:
        - AttributeName: doctor_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phoneNumber
          AttributeType: S
      KeySchema:
        - AttributeName: doctor_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phoneNumber
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ## Auth Table (phone-first identity store)
  AuthTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AuthTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phoneNumber
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: phoneNumber
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ## Verification Tokens Table
  AuthTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AuthTokensTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_id
          AttributeType: S
        - AttributeName: purpose
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phoneNumber
          AttributeType: S
      KeySchema:
        - AttributeName: token_id
          KeyType: HASH
        - AttributeName: purpose
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: purpose
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phoneNumber
              KeyType: HASH
            - AttributeName: purpose
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ## Sessions Table
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SessionsTable
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ## Doctor Availability Table
  DoctorAvailabilityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DoctorAvailabilityTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiry_timestamp
        Enabled: true

  ## Doctor Bookings Table
  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AppointmentsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserBookings
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_BookingId
          KeySchema:
            - AttributeName: booking_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      # TimeToLiveSpecification:
      #   AttributeName: ttl
      #   Enabled: true

  ## Chat History Table
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChatHistory
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S # Partition Key (String)
        - AttributeName: timestamp
          AttributeType: N # Sort Key (Number, for efficient sorting)
        - AttributeName: email
          AttributeType: S
        - AttributeName: date_bucket
          AttributeType: S # YYYY-MM-DD for global history queries
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH # Partition Key
        - AttributeName: timestamp
          KeyType: RANGE # Sort Key
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: date-timestamp-index
          KeySchema:
            - AttributeName: date_bucket
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ## Payments Table
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PaymentsTable
      AttributeDefinitions:
        - AttributeName: payment_id
          AttributeType: S # String (Partition Key)
      KeySchema:
        - AttributeName: payment_id
          KeyType: HASH # Partition Key
      BillingMode: PAY_PER_REQUEST

  ## Subscription Plans Table
  SubscriptionPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SubscriptionPlans
      AttributeDefinitions:
        - AttributeName: plan_id
          AttributeType: S
      KeySchema:
        - AttributeName: plan_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ## User Doctor Subscriptions Table
  UserDoctorSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserDoctorSubscriptions
      AttributeDefinitions:
        - AttributeName: subscription_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: doctor_id
          AttributeType: S
        - AttributeName: payment_id
          AttributeType: S
      KeySchema:
        - AttributeName: subscription_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserSubscriptions
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_DoctorSubscribers
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_PaymentSubscription
          KeySchema:
            - AttributeName: payment_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ## User Doctor Relations Table (persistent connectivity graph)
  UserDoctorRelationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserDoctorRelations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: relation_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: doctor_id
          AttributeType: S
      KeySchema:
        - AttributeName: relation_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserRelations
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: doctor_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI_DoctorRelations
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
            - AttributeName: user_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ## User <-> Hospital membership (M:N). One row per (hospital, patient).
  ## Query patients of a hospital via base table; hospitals of a user via GSI.
  UserHospitalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserHospital
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hospital_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: hospital_id
          KeyType: HASH
        - AttributeName: user_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserHospitals
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: hospital_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ## Doctor <-> Hospital affiliation (M:N). One row per (hospital, doctor).
  ## Query doctors of a hospital via base table; hospitals of a doctor via GSI.
  DoctorHospitalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DoctorHospital
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hospital_id
          AttributeType: S
        - AttributeName: doctor_id
          AttributeType: S
      KeySchema:
        - AttributeName: hospital_id
          KeyType: HASH
        - AttributeName: doctor_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_DoctorHospitals
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
            - AttributeName: hospital_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ## User <-> Doctor bond (M:N), hospital-independent. One row per (user, doctor).
  ## Query doctors of a user via base table; patients of a doctor via GSI.
  ## hospital_id (if any) rides as a non-key attribute, not part of identity.
  UserDoctorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserDoctor
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: doctor_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: doctor_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_DoctorUsers
          KeySchema:
            - AttributeName: doctor_id
              KeyType: HASH
            - AttributeName: user_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ## Doctor Earnings Ledger Table (Immutable Financial Ledger)
  DoctorEarningsLedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DoctorEarningsLedger
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: payment_id
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_PaymentEarnings
          KeySchema:
            - AttributeName: payment_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ## Doctor Payouts Table (Monthly Withdrawal Requests)
  DoctorPayoutsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DoctorPayoutsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: payout_id
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_PayoutId
          KeySchema:
            - AttributeName: payout_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ## Hospitals Table (password-based auth; email and contact_number as login identifiers)
  HospitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Hospitals
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hospital_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: contact_number
          AttributeType: S
      KeySchema:
        - AttributeName: hospital_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: contact_number-index
          KeySchema:
            - AttributeName: contact_number
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ## Hospital Raw Files Table (DEPRECATED — superseded by MedilockerDocuments
  ## with source=HOSPITAL + hospital_id. Kept for existing data; no new writes.)
  HospitalFilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HospitalFiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hospital_id
          AttributeType: S
        - AttributeName: file_id
          AttributeType: S
      KeySchema:
        - AttributeName: hospital_id
          KeyType: HASH
        - AttributeName: file_id
          KeyType: RANGE

  ## Medilocker Documents Table
  MedilockerDocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MedilockerDocuments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: file_id
          AttributeType: S
        # hospital_id is present only on docs uploaded by a hospital
        # (source=HOSPITAL). User-uploaded docs omit it, so hospital-index
        # is sparse and contains only hospital-sourced documents.
        - AttributeName: hospital_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: created_at
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: file_id-index
          KeySchema:
            - AttributeName: file_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # Hospital dashboard: every doc a hospital uploaded, across all patients.
        - IndexName: hospital-index
          KeySchema:
            - AttributeName: hospital_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ## ABHA Accounts Table
  AbhaAccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AbhaAccounts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: abha_number
          AttributeType: S
        - AttributeName: kokoro_user_id
          AttributeType: S
        - AttributeName: abha_address
          AttributeType: S
      KeySchema:
        - AttributeName: abha_number
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: kokoro_user_id-index
          KeySchema:
            - AttributeName: kokoro_user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: abha_address-index
          KeySchema:
            - AttributeName: abha_address
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HospitalAbdmConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HospitalAbdmConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hospital_id
          AttributeType: S
        - AttributeName: hip_id
          AttributeType: S
        - AttributeName: hiu_id
          AttributeType: S
      KeySchema:
        - AttributeName: hospital_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: hip_id-index
          KeySchema:
            - AttributeName: hip_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: hiu_id-index
          KeySchema:
            - AttributeName: hiu_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AbdmTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AbdmTransactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
        - AttributeName: hip_id
          AttributeType: S
        - AttributeName: abha_address
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: hip_id-index
          KeySchema:
            - AttributeName: hip_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: abha_address-index
          KeySchema:
            - AttributeName: abha_address
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ConsentArtefactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ConsentArtefacts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: consent_id
          AttributeType: S
      KeySchema:
        - AttributeName: consent_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ## Milestone 3 (HIU) — consent request lifecycle tracking
  HiuConsentRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HiuConsentRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
        - AttributeName: consent_request_id
          AttributeType: S
        - AttributeName: hiu_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: consent_request_id-index
          KeySchema:
            - AttributeName: consent_request_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: hiu_id-index
          KeySchema:
            - AttributeName: hiu_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ## Milestone 3 (HIU) — data-flow request state + ephemeral decryption keys
  HiuDataRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HiuDataRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: transaction_id-index
          KeySchema:
            - AttributeName: transaction_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  #============================== SQS — Async OCR Queue ====================================

  OCRQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OCRQueueDLQ
      MessageRetentionPeriod: 1209600 # 14 days

  OCRQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OCRQueue
      VisibilityTimeout: 300 # must be >= OCRWorkerLambda Timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OCRQueueDLQ.Arn
        maxReceiveCount: 3

  #============================== Lambda Layer — ocr_layer (package ocr_core) ===============

  OCRCoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: ocr-core
      Description: Shared Textract wrapper (pure OCR, no DynamoDB/LLM).
      ContentUri: ./ocr_layer/
      CompatibleRuntimes:
        - python3.11
    Metadata:
      # Avoid python3.11 BuildMethod nesting python/python/ocr_core (breaks import ocr_core).
      BuildMethod: makefile

  #============================== IAM Role for Lambda ======================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"
              - Effect: Allow
                Action:
                  # Sync (images)
                  - textract:AnalyzeDocument
                  - textract:DetectDocumentText
                  # Async (PDFs)
                  - textract:StartDocumentAnalysis
                  - textract:GetDocumentAnalysis
                  - textract:StartDocumentTextDetection
                  - textract:GetDocumentTextDetection
                Resource: "*"
              - Effect: Allow
                Action:
                  # MediLockerLambda: send OCR jobs to the queue
                  # OCRWorkerLambda: receive, delete, and inspect queue messages
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt OCRQueue.Arn
                  - !GetAtt OCRQueueDLQ.Arn

  #============================== Lambda Functions ======================================

  AuthLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AuthLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./auth_lambda/
      Environment:
        Variables:
          USERS_TABLE: Users # DynamoDB table for user authentication
          DOCTORS_TABLE: Doctors # DynamoDB table for doctor information
          USER_HOSPITAL_TABLE: UserHospital # patient <-> hospital membership (ABHA signup links here)
          DOCTOR_HOSPITAL_TABLE: DoctorHospital # doctor <-> hospital membership
          HOSPITALS_TABLE: Hospitals # hospital accounts (admin deletion lookup)
          USER_DOCTOR_TABLE: UserDoctor # patient <-> doctor unified relation junction
          AUTH_TABLE: AuthTable # DynamoDB table for phone auth metadata
          AUTH_TOKENS_TABLE: AuthTokensTable # DynamoDB table for storing verification tokens
          SESSIONS_TABLE: SessionsTable # DynamoDB table for storing user sessions

          BREVO_SMTP_USER: !Ref BrevoSmtpUser
          BREVO_SMTP_KEY: !Ref BrevoSmtpKey
          BREVO_SMTP_SERVER: smtp-relay.brevo.com
          BREVO_SMTP_PORT: "587"

          JWT_SECRET: !Ref JwtSecret
          JWT_EXP_MINUTES: "1440"
          JWT_ISSUER: "kokoro.doctor.auth"
          ADMIN_KEY: !Ref AuthAdminKey
          S3_BUCKET: "kokoro-doctor" # S3 bucket for file deletion
          HOSPITAL_FILES_TABLE: HospitalFiles # legacy hospital-upload metadata
          HOSPITAL_ABDM_TABLE: HospitalAbdmConfig
          CONSENT_ARTEFACTS_TABLE: ConsentArtefacts
          HIU_CONSENT_REQUESTS_TABLE: HiuConsentRequests
          HIU_DATA_REQUESTS_TABLE: HiuDataRequests

  UserServiceLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UserServiceLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./userService_lambda/
      Environment:
        Variables:
          USERS_TABLE: "Users" # DynamoDB table for user information
          DOCTORS_TABLE: "Doctors" # DynamoDB table for doctor information
          AUTH_TABLE: "AuthTable" # DynamoDB table for auth metadata
          AUTH_TOKENS_TABLE: "AuthTokensTable" # DynamoDB table for storing verification tokens
          SESSIONS_TABLE: "SessionsTable" # DynamoDB table for storing user sessions

  DoctorsServiceLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DoctorsServiceLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30 # Increase timeout in seconds
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./doctorsService_lambda/
      Environment:
        Variables:
          USERS_TABLE: "Users" # DynamoDB table for user information
          DOCTORS_TABLE: "Doctors" # DynamoDB table for doctor information
          DOCTOR_AVAILABILITY_TABLE: "DoctorAvailabilityTable" # DynamoDB table for doctor availability
          HOSPITALS_TABLE: "Hospitals" # DynamoDB table for hospitals (doctor-hospital linking)
          DOCTOR_HOSPITAL_TABLE: "DoctorHospital" # doctor <-> hospital affiliation junction (M:N)
          S3_BUCKET: kokoro-doctor # S3 bucket for storing doctor documents (uses DoctorDocuments/ folder)

  BookingLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: BookingLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./booking_lambda/
      Environment:
        Variables:
          SUBSCRIPTION_PLANS_TABLE: "SubscriptionPlans"
          USER_DOCTOR_SUBSCRIPTIONS_TABLE: "UserDoctorSubscriptions"
          USER_DOCTOR_TABLE: "UserDoctor"
          USER_DOCTOR_RELATIONS_TABLE: "UserDoctorRelations" # legacy; do not use for new relation writes
          ADMIN_KEY: !Ref BookingAdminKey

  ChatLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ChatLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30 # Increase timeout in seconds
