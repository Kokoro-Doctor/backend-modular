          PLATFORM_FEE_PERCENTAGE: "20.0"
          BREVO_SMTP_USER: !Ref BrevoSmtpUser
          BREVO_SMTP_KEY: !Ref BrevoSmtpKey
          BREVO_SMTP_SERVER: smtp-relay.brevo.com
          BREVO_SMTP_PORT: "587"
          ADMIN_EMAIL: !Ref AdminEmail

  DoctorPayoutsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: DoctorPayoutsLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./doctor_payouts_lambda/
      Environment:
        Variables:
          DOCTOR_PAYOUTS_TABLE: "DoctorPayoutsTable"
          DOCTOR_EARNINGS_LEDGER_TABLE: "DoctorEarningsLedger"

  ABHALambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ABHALambda
      Handler: app.main.handler
      Runtime: python3.11
      # 512MB: the ABDM data-flow ECDH (app/abdm/fidelius.py) is pure-Python
      # scalar multiplication, and Lambda scales CPU with memory. At 256MB a
      # data-flow session costs ~1s of CPU; 512MB roughly halves that at
      # near-identical cost, since duration halves too.
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./abha_lambda/
      Environment:
        Variables:
          ABHA_TABLE: "AbhaAccounts"
          HOSPITAL_ABDM_TABLE: "HospitalAbdmConfig"
          ABDM_TRANSACTIONS_TABLE: "AbdmTransactions"
          ABDM_TRANSACTION_TTL_DAYS: "90"
          CONSENT_ARTEFACTS_TABLE: "ConsentArtefacts"
          HIU_CONSENT_REQUESTS_TABLE: "HiuConsentRequests"
          HIU_DATA_REQUESTS_TABLE: "HiuDataRequests"
          # Public base URL registered with ABDM (3.2.4). Also used to build the HIU
          # dataPushUrl. MUST be set for M3 health-information requests to work.
          KOKORO_WEBHOOK_BASE_URL: !Ref KokoroWebhookBaseUrl
          ABDM_CLIENT_ID: !Ref AbdmClientId
          ABDM_CLIENT_SECRET: !Ref AbdmClientSecret
          ABDM_GATEWAY_BASE_URL: !Ref AbdmGatewayBaseUrl
          ABDM_ABHA_BASE_URL: !Ref AbdmAbhaBaseUrl
          ABDM_X_CM_ID: !Ref AbdmXCmId
          JWT_SECRET: !Ref JwtSecret
          JWT_ISSUER: "kokoro.doctor.auth"

  HospitalsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HospitalsLambda
      Handler: app.main.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./hospitals_lambda/
      Environment:
        Variables:
          HOSPITALS_TABLE: "Hospitals"
          USERS_TABLE: "Users"
          DOCTORS_TABLE: "Doctors"
          AUTH_TABLE: "AuthTable"
          DOCTOR_AVAILABILITY_TABLE: "DoctorAvailabilityTable"
          USER_HOSPITAL_TABLE: "UserHospital" # patient <-> hospital membership (M:N)
          DOCTOR_HOSPITAL_TABLE: "DoctorHospital" # doctor <-> hospital affiliation (M:N)
          USER_DOCTOR_TABLE: "UserDoctor" # patient <-> doctor bond (M:N)
          S3_BUCKET: "kokoro-doctor"
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRE_HOURS: "8"
          DOCUMENTS_TABLE: "MedilockerDocuments"
          OCR_QUEUE_URL: !Ref OCRQueue

  MediLockerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MediLockerLambda
      Handler: app.main.handler
      Runtime: python3.11
      # Higher memory = more CPU; helps OCR/LLM-heavy /insurance/analyze stay under API limits
      MemorySize: 1024
      Timeout: 120
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./medilocker_lambda/
      Layers:
        - !Ref OCRCoreLayer
      Environment:
        Variables:
          S3_BUCKET: kokoro-doctor # S3 bucket for storing medical files (uses Medilocker/ folder)
          # OPENAI_API_KEY: sk-proj-REDACTED
          GROQ_API_KEY: !Ref GroqApiKeyMedilocker
          DOCUMENTS_TABLE: "MedilockerDocuments"
          PRESCRIPTION_MAX_DOCS: "20"
          HOSPITAL_FILES_TABLE: "HospitalFiles"
          HOSPITAL_API_KEY: !Ref HospitalApiKey
          OCR_QUEUE_URL: !Ref OCRQueue

  OCRWorkerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: OCRWorkerLambda
      Handler: app.handler.handler
      Runtime: python3.11
      # Memory for Textract polling; no CPU-heavy work
      MemorySize: 512
      # Must be <= SQS VisibilityTimeout (300). Textract PDF polling uses max_wait=270s.
      Timeout: 300
      Role: !GetAtt LambdaExecutionRole.Arn
      CodeUri: ./ocr_worker_lambda/
      Layers:
        - !Ref OCRCoreLayer
      Events:
        OCRQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt OCRQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      Environment:
        Variables:
          S3_BUCKET: kokoro-doctor
          S3_FOLDER_PREFIX: "Medilocker/Users/"
          DOCUMENTS_TABLE: "MedilockerDocuments"

